name: Lianban Daily

# GitHub Actions 的 cron 始终为 UTC。
# 下方已换算为北京时间（UTC+8，无夏令时）。
#
# | 北京时间        | UTC cron        |
# |----------------|-----------------|
# | 周一至五 15:35 | 35 7 * * 1-5    |  # A 股收盘后生成当日连板数据

on:
  schedule:
    - cron: "35 7 * * 1-5"
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  lianban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily lianban report
        run: |
          echo "Beijing time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          python scripts/lianban.py today --min-boards 1
          python scripts/lianban.py publish

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain 'docs/03-智能策略/连板数据')" ]; then
            git add docs/03-智能策略/连板数据/
            git commit -m "chore(lianban): update daily report [skip ci]"
            git push
          else
            echo "No lianban data changes to commit"
          fi
