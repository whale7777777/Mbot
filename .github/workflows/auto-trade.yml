name: AutoTrade

# GitHub Actions 的 cron 始终为 UTC（不是北京时间）。
# 若需按 A 股交易时段触发，请用 UTC = 北京时间 - 8 小时。
#
# | 北京时间（周一至五） | UTC cron           |
# |---------------------|--------------------|
# | 09:25 盘前          | 25 1 * * 1-5       |
# | 13:00 午盘          | 0 5 * * 1-5        |
# | 15:00 收盘          | 0 7 * * 1-5        |

on:
  schedule:
    - cron: "25 1 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 7 * * 1-5"

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Log Beijing time
        run: echo "Beijing time $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Every trade day
        run: |
          ./.github/scripts/run_all.sh --test
        shell: bash

      - name: 'Sending SMS Notification'
        uses: plivo/action-sms@v1
        with:
          fromPhoneNumber: ${{ secrets.FROM_NUMBER }}
          toPhoneNumber: ${{ secrets.TO_NUMBER }}
          message: '💡There has been new release to ${{ github.repository }}'
        env:
          PLIVO_AUTH_ID: ${{ secrets.PLIVO_AUTH_ID }}
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}

